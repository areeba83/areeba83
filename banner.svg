<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep violet → near-black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0533" />
      <stop offset="50%"  stop-color="#110022" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <!-- Purple accent gradient for the glow line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent" />
      <stop offset="20%"  stop-color="#A855F7" />
      <stop offset="50%"  stop-color="#22D3EE" />
      <stop offset="80%"  stop-color="#A855F7" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Soft radial glow behind the text area -->
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%"  stop-color="#A855F7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <style>
      /* ── Fonts ── */
      .title {
        font: bold 48px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
        fill: #ffffff;
      }
      .subtitle {
        font: 500 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
        fill: #d4b8f0;
      }
      .tagline {
        font: 400 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
        fill: #7dd3fc;
        letter-spacing: 1.5px;
      }

      /* ── Fade-in animation ── */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade1 { opacity: 0; animation: fadeIn 0.8s ease-out 0.2s forwards; }
      .fade2 { opacity: 0; animation: fadeIn 0.8s ease-out 0.55s forwards; }
      .fade3 { opacity: 0; animation: fadeIn 0.8s ease-out 0.9s forwards; }
      .fade4 { opacity: 0; animation: fadeIn 0.8s ease-out 1.1s forwards; }

      /* ── Soft glow pulse on the accent line ── */
      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }
      .accent-line { animation: glowPulse 4s ease-in-out infinite; }

      /* ── Floating dots ── */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      .dot { animation: float 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" />

  <!-- Radial glow -->
  <rect width="1200" height="300" fill="url(#glow)" />

  <!-- Subtle decorative dots (purple + cyan) -->
  <circle class="dot" cx="120"  cy="60"  r="2"   fill="#A855F7" opacity="0.35" style="animation-delay:0s" />
  <circle class="dot" cx="250"  cy="240" r="1.5" fill="#22D3EE" opacity="0.3"  style="animation-delay:1s" />
  <circle class="dot" cx="950"  cy="50"  r="2.5" fill="#A855F7" opacity="0.25" style="animation-delay:0.5s" />
  <circle class="dot" cx="1060" cy="230" r="1.8" fill="#22D3EE" opacity="0.3"  style="animation-delay:1.5s" />
  <circle class="dot" cx="80"   cy="160" r="1.2" fill="#22D3EE" opacity="0.2"  style="animation-delay:2s" />
  <circle class="dot" cx="1120" cy="90"  r="1.5" fill="#A855F7" opacity="0.2"  style="animation-delay:0.8s" />

  <!-- ── Main text ── -->
  <text x="600" y="115" text-anchor="middle" class="title fade1">Hi, I&#x2019;m Areeba Amar</text>

  <!-- ── Accent line ── -->
  <rect class="accent-line fade2" x="380" y="138" width="440" height="2" rx="1" fill="url(#accentLine)" />

  <!-- ── Subtitle ── -->
  <text x="600" y="175" text-anchor="middle" class="subtitle fade3">AI/ML Intern @ Systems Limited  |  BS Software Engineering @ UMT Lahore</text>

  <!-- ── Tagline ── -->
  <text x="600" y="215" text-anchor="middle" class="tagline fade4">RAG Chatbots &#x2022; Reinforcement Learning &#x2022; Full-Stack Development</text>
</svg>
